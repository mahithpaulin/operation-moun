name: exp02
on:
  push:
    branches: [main]
    paths: ['experiments/exp02_cegis/**', 'experiments/exp01_enumeration/synth.py', '.github/workflows/exp02.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exp02:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run exp02 (no deps, stdlib only)
        run: python3 experiments/exp02_cegis/run.py --max-size 9 --per-round 100000 --max-rounds 8 --seed-n 4 --out results/exp02.json
      - name: Commit results
        run: |
          git config user.name "moun-bot"
          git config user.email "moun-bot@users.noreply.github.com"
          git add results/
          git diff --cached --quiet && exit 0
          git commit -m "exp02 results [skip ci]"
          for i in 1 2 3; do
            git fetch origin main && git rebase origin/main && git push && break
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
