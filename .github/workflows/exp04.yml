name: exp04
on:
  push:
    branches: [main]
    paths: ['experiments/exp04_loops/**', '.github/workflows/exp04.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shard:
    strategy:
      matrix:
        task: [sum_to_n, fib, fact, pow2n]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run exp04 shard ${{ matrix.task }}
        run: python3 experiments/exp04_loops/run.py --budget 200000 --tasks ${{ matrix.task }} --out shard_${{ matrix.task }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: exp04-${{ matrix.task }}
          path: shard_${{ matrix.task }}.json
  merge:
    needs: [shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: exp04-*
          merge-multiple: true
      - name: Merge + commit
        run: |
          python3 -c "
          import json, glob
          rows = []
          for f in sorted(glob.glob('shard_*.json')):
              rows += json.load(open(f))['rows']
          json.dump({'rows': rows}, open('results/exp04.json', 'w'), indent=2)
          print(len(rows), 'tasks merged')
          "
          git config user.name "moun-bot"
          git config user.email "moun-bot@users.noreply.github.com"
          git add results/
          git status --short
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "exp04 results [skip ci]"
          for i in 1 2 3; do
            git fetch origin main && git rebase origin/main && git push && break
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
