name: exp01
on:
  push:
    branches: [main]
    paths-ignore: ['results/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exp01:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run exp01 (no deps, stdlib only)
        run: python3 experiments/exp01_enumeration/run.py --max-size 9 --max-programs 300000 --out results/exp01.json
      - name: Commit results
        run: |
          git config user.name "moun-bot"
          git config user.email "moun-bot@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "exp01 results [skip ci]"
          git push
